[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=warn
pidfile=/tmp/supervisord.pid

; ── 1. Virtual framebuffer ─────────────────────────────────────────────────
[program:xvfb]
command=Xvfb :0 -screen 0 1280x720x24 -nolisten tcp -ac -noreset
autostart=true
autorestart=true
startsecs=1
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── 2. Window manager (waits for Xvfb) ────────────────────────────────────
[program:fluxbox]
command=/bin/bash -c 'until xdpyinfo -display :0 >/dev/null 2>&1; do sleep 0.2; done; exec fluxbox'
autostart=true
autorestart=true
startsecs=2
startretries=10
priority=20
environment=DISPLAY=":0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── 3. VNC server (waits for Xvfb, auto-restarts on crash) ────────────────
; -noxdamage  avoids the XDamage code path that can cause crashes under load
; -forever    keeps x11vnc alive after clients disconnect
; -shared     allows multiple simultaneous viewers
[program:x11vnc]
command=/bin/bash -c 'until xdpyinfo -display :0 >/dev/null 2>&1; do sleep 0.2; done; exec x11vnc -display :0 -forever -shared -rfbport 5900 -nopw -nodpms -noxdamage'
autostart=true
autorestart=true
startsecs=2
startretries=10
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── 4. noVNC WebSocket proxy (waits for x11vnc on port 5900) ──────────────
[program:websockify]
command=/bin/bash -c 'until (echo >/dev/tcp/localhost/5900) 2>/dev/null; do sleep 0.5; done; exec websockify --web=/usr/share/novnc 6080 localhost:5900'
autostart=true
autorestart=true
startsecs=2
startretries=10
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── 5. MegaBasterd ────────────────────────────────────────────────────────
; autorestart=true keeps the GUI available even if the JVM exits unexpectedly
; stopwaitsecs=30  gives in-progress downloads time to flush before SIGKILL
[program:megabasterd]
command=java -Duser.home=/config -Djava.awt.headless=false -jar /app/megabasterd.jar
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=30
priority=50
environment=DISPLAY=":0",HOME="/config"
directory=/downloads
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
